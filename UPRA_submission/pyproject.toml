[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upra"
version = "0.1.0"
description = "Reference implementation of User Preference Retrieval and Alignment"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "torch>=2.1"]

[tool.setuptools.packages.find]
include = ["upra*"]
