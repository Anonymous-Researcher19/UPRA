# Paper-faithful defaults. Paths are relative to this file.
seed: 2023
device: cuda
output_dir: ../outputs/default

assets:
  clap_checkpoint: ../assets/checkpoints/CLAP_weights_2023.pth
  music4all_metadata: ../data/raw/music4all.jsonl
  mtg_jamendo_metadata: ../data/raw/mtg_jamendo.jsonl
  fma_large_metadata: ../data/raw/fma_large.jsonl
  mtg_features: ../data/processed/mtg_clap_features.pt
  fma_features: ../data/processed/fma_clap_features.pt
  feature_records: ../data/processed/feature_records.pt

data:
  records: ../data/processed/feature_records.pt
  audio_root: ../data/raw
  split: train
  audio_sample_rate: 44100
  track_excerpt_seconds: 30
  chunk_seconds: 5
  chunk_stride_seconds: 2.5

model:
  feature_dim: 512
  num_heads: 8
  beta: 0.5
  lambda_align: 0.1
  eta: 0.6

retrieval:
  top_k: 5
  lexical_weight: 0.5
  external_repository: FMA-large

backbone:
  name: musicgen
  # Import path of the frozen upstream-model wrapper (module:function).
  factory: null
  native_conditioning_dim: 1024
  frozen: true

training:
  steps: 100000
  # Four-GPU paper schedule: 1 sample/GPU x 4 GPUs x 16 updates = 64.
  per_device_batch_size: 1
  workers: 4
  learning_rate: 0.00001
  weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  gradient_accumulation: 16
  effective_batch_size: 64
  precision: bfloat16
  distributed_backend: nccl
  gradient_checkpointing: true

experiment:
  variant: full

generation:
  duration_seconds: 10
  same_seed_across_strategies: true
